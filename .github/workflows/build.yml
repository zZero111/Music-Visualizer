name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force

      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SphereVisualizer-${{ runner.os }}
          path: |
            plugin/build/SphereVisualizer_artefacts/Release/VST3
            plugin/build/SphereVisualizer_artefacts/Release/AU
            plugin/build/SphereVisualizer_artefacts/Release/Standalone
          if-no-files-found: warn
